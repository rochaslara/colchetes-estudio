<style>
/* Layout: one slim tool bar on top, the active studio fills everything below it. Each tab carries its tool's own accent. */
:root{
  --bar:#f7f6f4; --line:#dedbd6; --fg:#17161a; --muted:#6c6873; --hover:#ecebe7; --sel:#ffffff; --stage:#e9e8e4;
  --c-brackets:#1F3A63; --c-charts:#B3842A;
  --display:"Tenor Sans","Century Gothic",sans-serif;
  --ui:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bar:#121216; --line:#26252c; --fg:#ebe9ee; --muted:#8f8b98; --hover:#1c1b21; --sel:#24232a; --stage:#0b0b0e;
  --c-brackets:#8FB0E0; --c-charts:#E8C36D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bar:#121216; --line:#26252c; --fg:#ebe9ee; --muted:#8f8b98; --hover:#1c1b21; --sel:#24232a; --stage:#0b0b0e;
  --c-brackets:#8FB0E0; --c-charts:#E8C36D; color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden}
*{box-sizing:border-box}
.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{display:flex;align-items:center;gap:18px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font:400 19px/1 var(--display);letter-spacing:.01em;flex:none}
.brand i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--c-brackets) 0 50%,var(--c-charts) 0)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;color:var(--muted);border-radius:8px;padding:6px 12px 6px 10px;cursor:pointer;font:500 14px var(--ui)}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--tc);opacity:.55}
.tab small{font:400 12px/1 var(--ui);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--sel);color:var(--fg);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--tc)}
.tab[aria-selected="true"] .dot{opacity:1}
.tab:focus-visible{outline:2px solid var(--tc);outline-offset:1px}
.hint{flex:none;font:500 10.5px var(--mono);color:var(--muted)}
.frames{position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--stage)}
@media (max-width:760px){.tab small,.hint{display:none}.bar{gap:10px}.brand span{display:none}}
</style>

  </header>

</div>

face:#111B46; --sunk:#070E29; --line:#27336C; --ink:#F3EBDA; --muted:#A2A9C8;\n    --accent:#8AABDF; --gold:#E8C36D; --on-ink:#0B1335; --danger:#E58C77; --step:#E8C36D; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0B1335; --surface:#111B46; --sunk:#070E29; --line:#27336C; --ink:#F3EBDA; --muted:#A2A9C8;\n  --accent:#8AABDF; --gold:#E8C36D; --on-ink:#0B1335; --danger:#E58C77; --step:#E8C36D; color-scheme:dark;\n}\nhtml,body{height:100%}\nbody{background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--ui);-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nbutton{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n\n.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}\n.top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);min-width:0}\n.brand{font-family:var(--display);font-size:22px;white-space:nowrap;line-height:1}\n.shelf-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:0}\n.shelf-label{font-size:12px;color:var(--muted);white-space:nowrap}\n.shelf{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:4px 2px;scrollbar-width:thin}\n.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;white-space:nowrap;font-size:13.5px;max-width:220px}\n.chip span{overflow:hidden;text-overflow:ellipsis}\n.chip canvas{width:44px;height:28px;border-radius:999px;display:block;flex:none;background:var(--sunk)}\n.chip[aria-current=\"true\"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}\n.actions{display:flex;gap:8px;flex:none}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:14px;white-spac \n.x{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px 8px;line-height:1;font-size:16px}\n.x:hover{color:var(--danger)}\n.th-wrap{display:flex;align-items:center}\n.tools{display:flex;flex-wrap:wrap;gap:8px}\n.paste-box{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}\n.paste-box b{font-weight:600;font-size:13.5px}\n\n.overlay{position:fixed;inset:0;background:rgba(7,12,38,.55);display:grid;place-items:center;padding:20px;z-index:20}\n.dialog{background:var(--surface);color:var(--ink);border-radius:16px;max-width:980px;width:100%;max-height:90vh;overflow:auto;padding:24px}\n.dialog h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 4px;text-wrap:balance}\n.dialog p{margin:0 0 18px;color:var(--muted)}\n.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}\n.pick{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;cursor:pointer;text-align:left;display:grid;gap:8px}\n.pick:hover{border-color:var(--ink)}\n.pick .th{aspect-ratio:16/10;display:grid;place-items:center;background:var(--sunk);border-radius:8px;overflow:hidden}\n.pick canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block}\n.pick b{font-weight:600;font-size:14px}\n.pick small{color:var(--muted);font-size:12.5px;line-height:1.35}\n.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}\n.fallback img{max-width:100%;max-height:60vh;display:block;margin:0 auto 12px;border:1px solid var(--line)}\n\n.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25)}\n\n.in-suite .brand{display:none}\n@media (max-width:900px){\n  .app{height:auto}\n  .work{grid-template-columns:1fr}\n  .stage{min-height:auto;padding:20px 16px}\n  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}\n  .top{flex-wrap:wrap;padding:10px 16px}\n  .shelf-wrap{order:3;flex-basis:100%}\n  .actions{margin-left:auto}\n}\n@media (max-width:420px){ .pals,.types{grid-template-columns:repeat(2,1fr)} .shelf-label{display:none} }\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style>\n\n\u003cdiv class=\"app\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"brand\">Gr\u00e1ficos\u003c/div>\n    \u003cdiv class=\"shelf-wrap\">\u003cspan class=\"shelf-label\">Seus gr\u00e1ficos:\u003c/span>\u003cnav class=\"shelf\" id=\"shelf\" aria-label=\"Seus gr\u00e1ficos\">\u003c/nav>\u003c/div>\n    \u003cdiv class=\"actions\">\n      \u003cbutton class=\"btn\" id=\"newBtn\" type=\"button\">\u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003cpath d=\"M8 3v10M3 8h10\"/>\u003c/svg>Novo gr\u00e1fico\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"exportTop\" type=\"button\">\u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003cpath d=\"M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10\"/>\u003c/svg>Baixar imagem\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"work\">\n    \u003csection class=\"stage\" id=\"stage\" aria-label=\"Pr\u00e9via\">\n      \u003cdiv class=\"canvas-wrap\" id=\"wrap\">\u003ccanvas id=\"view\" role=\"img\" aria-label=\"Pr\u00e9via do gr\u00e1fico\">\u003c/canvas>\u003c/div>\n      \u003cdiv class=\"meta\" id=\"meta\">\u003c/div>\n    \u003c/section>\n\n    \u003caside class=\"panel\" id=\"panel\">\n      \u003cdetails class=\"sec\" open>\n        \u003csummary>\u003cspan class=\"num\">1\u003c/span>\u003cspan class=\"sum-t\">\u003cb>Tipo de gr\u00e1fico\u003c/b>\u003csmall>Clique para trocar. Seus dados continuam.\u003c/small>\u003c/span>\u003c/summary>\n        \u003cdiv class=\"sec-body\">\n          \u003cdiv class=\"types\" id=\"types\">\u003c/div>\n        \u003c/div>\n      \u003c/details>\n\n      \u003cdetails class=\"sec\" open id=\"dataSec\">\n        \u003csummary>\u003cspan class=\"num\">2\u003c/span>\u003cspan class=\"sum-t\">\u003cb>Dados\u003c/b>\u003csmall>Digite os n\u00fameros ou cole de uma planilha\u003c/small>\u003c/span>\u003c/summary>\n        \u003cdiv class=\"sec-body\">\n          \u003cdiv data-types=\"gauge\" class=\"sec-body\" style=\"padding:0\">\n            \u003cdiv class=\"row3\">\n              \u003clabel class=\"field\">\u003cspan>Valor\u003c/span>\u003cinput type=\"text\" id=\"f-gv\" data-k=\"gauge.value\">\u003c/label>\n              \u003clabel class=\"field\">\u003cspan>De um total de\u003c/span>\u003cinput type=\"text\" id=\"f-gm\" data-k=\"gauge.max\">\u003c/label>\n              \u003clabel class=\"field\">\u003cspan>Texto no centro\u003c/span>\u003cinput type=\"text\" id=\"f-gt\" data-k=\"gauge.text\" placeholder=\"Autom\u00e1tico\">\u003c/label>\n            \u003c/div>\n            \u003clabel class=\"field\">\u003cspan>Legenda embaixo do n\u00famero\u003c/span>\u003cinput type=\"text\" id=\"f-gl\" data-k=\"gauge.label\">\u003c/label>\n          \u003c/div>\n          \u003cdiv data-types=\"kpi\" class=\"sec-body\" style=\"padding:0\">\n            \u003clabel class=\"field\">\u003cspan>N\u00famero\u003c/span>\u003cinput type=\"text\" id=\"f-kv\" data-k=\"kpi.value\">\u003c/label>\n            \u003cdiv class=\"row2\">\n              \u003clabel class=\"field\">\u003cspan>Texto acima\u003c/span>\u003cinput type=\"text\" id=\"f-kc\" data-k=\"kpi.caption\">\u003c/label>\n              \u003clabel class=\"field\">\u003cspan>Etiqueta embaixo\u003c/span>\u003cinput type=\"text\" id=\"f-kt\" data-k=\"kpi.tag\">\u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv data-types=\"leaf grouped capsules pills donut pie line\" class=\"sec-body\" style=\"padding:0\">\n            \u003cp class=\"hint\" id=\"dataHint\">\u003c/p>\n            \u003cdiv class=\"tablewrap\">\u003ctable class=\"data\" id=\"table\">\u003c/table>\u003c/div>\n            \u003cdiv class=\"tools\">\n              \u003cbutton class=\"btn small\" id=\"addRow\" type=\"button\">+ Linha\u003c/button>\n              \u003cbutton class=\"btn small\" id=\"addSeries\" type=\"button\">+ Coluna de valores\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"paste-box\">\n              \u003cb>Tem os dados no Excel ou no Google Planilhas?\u003c/b>\n              \u003ctextarea id=\"paste\" rows=\"3\" placeholder=\"Selecione as c\u00e9lulas, copie (Ctrl+C) e cole aqui (Ctrl+V)\">\u003c/textarea>\n              \u003cp class=\"hint\">A primeira coluna vira os nomes. Se a primeira linha tiver t\u00edtulos, eles viram os nomes das colunas de valores.\u003c/p>\n              \u003cdiv class=\"tools\">\u003cbutton class=\"btn small primary\" id=\"pasteBtn\" type=\"button\">Usar estes dados\u003c/button>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/details>\n\n      \u003cdetails class=\"sec\" open>\n        \u003csummary>\u003cspan class=\"num\">3\u003c/span>\u003cspan class=\"sum-t\">\u003cb>Textos\u003c/b>\u003csmall>T\u00edtulo, subt\u00edtulo e fonte dos dados\u003c/small>\u003c/span>\u003c/summary>\n        \u003cdiv class=\"sec-body\">\n          \u003clabel class=\"field\">\u003cspan>T\u00edtulo\u003c/span>\u003ctextarea id=\"f-title\" data-k=\"title\" rows=\"2\" placeholder=\"Deixe vazio para n\u00e3o ter t\u00edtulo\">\u003c/textarea>\u003c/label>\n          \u003clabel class=\"field\">\u003cspan>Subt\u00edtulo\u003c/span>\u003cinput type=\"text\" id=\"f-sub\" data-k=\"subtitle\">\u003c/label>\n          \u003clabel class=\"field\">\u003cspan>Nota de rodap\u00e9\u003c/span>\u003cinput type=\"text\" id=\"f-note\" data-k=\"note\" placeholder=\"Fonte: \u2026\">\u003c/label>\n          \u003cdiv class=\"row2\" data-types=\"donut\">\n            \u003clabel class=\"field\">\u003cspan>N\u00famero no centro\u003c/span>\u003cinput type=\"text\" id=\"f-cv\" data-k=\"centerValue\" placeholder=\"Autom\u00e1tico: total\">\u003c/label>\n            \u003clabel class=\"field\">\u003cspan>Texto no centro\u003c/span>\u003cinput type=\"text\" id=\"f-cl\" data-k=\"centerLabel\">\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"row2\" data-types=\"line\">\n            \u003clabel class=\"field\">\u003cspan>Texto depois da varia\u00e7\u00e3o\u003c/span>\u003cinput type=\"text\" id=\"f-dl\" data-k=\"deltaLabel\" placeholder=\"hoje\">\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"field\" data-types=\"leaf donut gauge line kpi\">\u003cspan>Fonte dos n\u00fameros\u003c/span>\n            \u003cdiv class=\"seg\">\n              \u003clabel>\u003cinput type=\"radio\" name=\"valueFont\" value=\"serif\" data-k=\"valueFont\">\u003cspan id=\"vfHl\" class=\"f-hl\">Newsreader\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"valueFont\" value=\"sans\" data-k=\"valueFont\">\u003cspan>DM Sans\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003clabel class=\"field\" id=\"nameField\">\u003cspan>Nome do gr\u00e1fico (aparece na lista l\u00e1 em cima)\u003c/span>\u003cinput type=\"text\" id=\"f-name\" data-k=\"name\">\u003c/label>\n        \u003c/div>\n      \u003c/details>\n\n      \u003cdetails class=\"sec\" open>\n        \u003csummary>\u003cspan class=\"num\">4\u003c/span>\u003cspan class=\"sum-t\">\u003cb>Cores\u003c/b>\u003csmall>Escolha uma paleta pronta\u003c/small>\u003c/span>\u003c/summary>\n        \u003cdiv class=\"sec-body\">\n          \u003cdiv class=\"pals\" id=\"pals\">\u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"lbl\" style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">\u003cspan id=\"slotTitle\">Trocar uma cor\u003c/span>\u003cbutton class=\"btn small ghost\" id=\"resetColors\" type=\"button\">Voltar ao original\u003c/button>\u003c/div>\n            \u003cdiv class=\"slots\" id=\"slots\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"field\">\u003cspan>Fundo\u003c/span>\n            \u003cdiv class=\"seg\">\n              \u003clabel>\u003cinput type=\"radio\" name=\"bgMode\" value=\"palette\" data-k=\"bgMode\">\u003cspan>Da paleta\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"bgMode\" value=\"white\" data-k=\"bgMode\">\u003cspan>Branco\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"bgMode\" value=\"custom\" data-k=\"bgMode\">\u003cspan>Outra cor\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"bgMode\" value=\"none\" data-k=\"bgMode\">\u003cspan>Transparente\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"row2\">\n            \u003clabel class=\"field\" id=\"bgColorField\">\u003cspan>Cor do fundo\u003c/span>\u003cinput type=\"color\" id=\"f-bgc\" data-k=\"bgColor\">\u003c/label>\n            \u003clabel class=\"field\">\u003cspan>Cor dos textos\u003c/span>\u003cinput type=\"color\" id=\"f-ink\" data-k=\"ink\">\u003c/label>\n          \u003c/div>\n        \u003c/div>\n      \u003c/details>\n\n      \u003cdetails class=\"sec\" open>\n        \u003csummary>\u003cspan class=\"num\">5\u003c/span>\u003cspan class=\"sum-t\">\u003cb>Baixar\u003c/b>\u003csmall>Salva uma imagem PNG para usar no slide\u003c/small>\u003c/span>\u003c/summary>\n        \u003cdiv class=\"sec-body\">\n          \u003clabel class=\"field\">\u003cspan>Tamanho\u003c/span>\n            \u003cselect id=\"f-preset\" data-k=\"preset\">\n              \u003coption value=\"1920x1080\">Slide inteiro (horizontal)\u003c/option>\n              \u003coption value=\"1600x900\">Meio slide (horizontal)\u003c/option>\n              \u003coption value=\"1200x900\">Formato 4:3\u003c/option>\n              \u003coption value=\"1080x1080\">Quadrado (post)\u003c/option>\n              \u003coption value=\"1080x1350\">Retrato (post vertical)\u003c/option>\n              \u003coption value=\"1080x1920\">Story (tela de celular)\u003c/option>\n              \u003coption value=\"custom\">Personalizado\u003c/option>\n            \u003c/select>\n          \u003c/label>\n          \u003cdiv class=\"field\">\u003cspan>Qualidade\u003c/span>\n            \u003cdiv class=\"seg\">\n              \u003clabel>\u003cinput type=\"radio\" name=\"scale\" value=\"1\" data-k=\"exportScale\" data-num>\u003cspan>Normal\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"scale\" value=\"2\" data-k=\"exportScale\" data-num>\u003cspan>Alta\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"scale\" value=\"4\" data-k=\"exportScale\" data-num>\u003cspan>M\u00e1xima\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003cp class=\"hint\" id=\"exportInfo\">\u003c/p>\n          \u003cbutton class=\"btn primary big\" id=\"exportBtn\" type=\"button\">Baixar imagem (PNG)\u003c/button>\n          \u003cdiv class=\"tools\">\u003cbutton class=\"btn small\" id=\"copyBtn\" type=\"button\">Copiar imagem\u003c/button>\u003cbutton class=\"btn small\" id=\"dupBtn\" type=\"button\">Duplicar gr\u00e1fico\u003c/button>\u003cbutton class=\"btn small danger\" id=\"delBtn\" type=\"button\">Apagar gr\u00e1fico\u003c/button>\u003c/div>\n        \u003c/div>\n      \u003c/details>\n\n      \u003cdiv class=\"more-head\">Mais ajustes (opcional)\u003c/div>\n\n      \u003cdetails class=\"sec minor\">\n        \u003csummary>\u003cspan class=\"sum-t\">\u003cb>Formato das barras e fatias\u003c/b>\u003c/span>\u003c/summary>\n        \u003cdiv class=\"sec-body\">\n          \u003cdiv class=\"field\" data-types=\"leaf grouped\">\u003cspan>Cantos das barras\u003c/span>\n            \u003cdiv class=\"seg\">\n              \u003clabel>\u003cinput type=\"radio\" name=\"corner\" value=\"leaf\" data-k=\"corner\">\u003cspan>Folha\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"corner\" value=\"top\" data-k=\"corner\">\u003cspan>Arredondado\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"corner\" value=\"pill\" data-k=\"corner\">\u003cspan>Redondo\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"corner\" value=\"square\" data-k=\"corner\">\u003cspan>Reto\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003clabel class=\"field\" data-types=\"leaf grouped\">\u003cspan>Tamanho da curva \u003coutput data-o=\"radius\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-rad\" data-k=\"radius\" min=\"0\" max=\"0.5\" step=\"0.01\">\u003c/label>\n          \u003clabel class=\"field\" data-types=\"leaf\">\u003cspan>Espa\u00e7o entre as barras \u003coutput data-o=\"gap\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-gap\" data-k=\"gap\" min=\"0\" max=\"0.6\" step=\"0.01\">\u003c/label>\n          \u003clabel class=\"field\" data-types=\"grouped\">\u003cspan>Espa\u00e7o entre os grupos \u003coutput data-o=\"groupGap\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-ggap\" data-k=\"groupGap\" min=\"0\" max=\"0.7\" step=\"0.01\">\u003c/label>\n          \u003clabel class=\"field\" data-types=\"capsules\">\u003cspan>Espa\u00e7o entre as c\u00e1psulas \u003coutput data-o=\"capGap\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-cgap\" data-k=\"capGap\" min=\"0.02\" max=\"0.6\" step=\"0.01\">\u003c/label>\n          \u003cdiv class=\"field\" data-types=\"leaf\">\u003cspan>Onde ficam os n\u00fameros\u003c/span>\n            \u003cdiv class=\"seg\">\n              \u003clabel>\u003cinput type=\"radio\" name=\"valueStyle\" value=\"header\" data-k=\"valueStyle\">\u003cspan>Grandes, no topo\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"valueStyle\" value=\"inside\" data-k=\"valueStyle\">\u003cspan>Dentro da barra\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"valueStyle\" value=\"above\" data-k=\"valueStyle\">\u003cspan>Em cima da barra\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"field\" data-types=\"leaf\">\u003cspan>Cores das barras\u003c/span>\n            \u003cdiv class=\"seg\">\n              \u003clabel>\u003cinput type=\"radio\" name=\"colorBy\" value=\"category\" data-k=\"colorBy\">\u003cspan>Uma cor para cada\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"colorBy\" value=\"series\" data-k=\"colorBy\">\u003cspan>Todas iguais\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"field\" data-types=\"pills\">\u003cspan>Estilo\u003c/span>\n            \u003cdiv class=\"seg\">\n              \u003clabel>\u003cinput type=\"radio\" name=\"pillStyle\" value=\"outlined\" data-k=\"pillStyle\">\u003cspan>Uma dentro da outra\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"pillStyle\" value=\"flush\" data-k=\"pillStyle\">\u003cspan>Lado a lado\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003clabel class=\"field\" data-types=\"pills\">\u003cspan>Altura das barras \u003coutput data-o=\"pillSize\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-psz\" data-k=\"pillSize\" min=\"4\" max=\"20\" step=\"0.5\">\u003c/label>\n          \u003clabel class=\"field\" data-types=\"donut\">\u003cspan>Espessura do anel \u003coutput data-o=\"thick\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-th\" data-k=\"thick\" min=\"0.1\" max=\"0.8\" step=\"0.01\">\u003c/label>\n          \u003clabel class=\"field\" data-types=\"gauge\">\u003cspan>Espessura do arco \u003coutput data-o=\"gthick\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-gth\" data-k=\"gthick\" min=\"0.01\" max=\"0.2\" step=\"0.005\">\u003c/label>\n          \u003clabel class=\"field\" data-types=\"donut pie\">\u003cspan>Girar \u003coutput data-o=\"rotation\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-rot\" data-k=\"rotation\" min=\"-180\" max=\"180\" step=\"5\">\u003c/label>\n          \u003cdiv class=\"checks\">\n            \u003clabel class=\"check\" data-types=\"leaf\">\u003cinput type=\"checkbox\" id=\"c-rules\" data-k=\"rules\">Linhas entre colunas\u003c/label>\n            \u003clabel class=\"check\" data-types=\"leaf grouped capsules pills pie\">\u003cinput type=\"checkbox\" id=\"c-vals\" data-k=\"showValues\">Mostrar n\u00fameros\u003c/label>\n            \u003clabel class=\"check\" data-types=\"capsules pills\">\u003cinput type=\"checkbox\" id=\"c-cat\" data-k=\"showCategory\">Mostrar nomes\u003c/label>\n            \u003clabel class=\"check\" data-types=\"grouped\">\u003cinput type=\"checkbox\" id=\"c-axis\" data-k=\"showAxis\">Escala de valores\u003c/label>\n            \u003clabel class=\"check\" data-types=\"grouped line\">\u003cinput type=\"checkbox\" id=\"c-grid\" data-k=\"grid\">Linhas de grade\u003c/label>\n            \u003clabel class=\"check\" data-types=\"leaf grouped capsules pills donut pie line\">\u003cinput type=\"checkbox\" id=\"c-leg\" data-k=\"showLegend\">Legenda\u003c/label>\n            \u003clabel class=\"check\" data-types=\"donut\">\u003cinput type=\"checkbox\" id=\"c-caps\" data-k=\"roundCaps\">Pontas redondas\u003c/label>\n            \u003clabel class=\"check\" data-types=\"pie donut\">\u003cinput type=\"checkbox\" id=\"c-sort\" data-k=\"sortDesc\">Maior primeiro\u003c/label>\n            \u003clabel class=\"check\" data-types=\"line\">\u003cinput type=\"checkbox\" id=\"c-sum\" data-k=\"showSummary\">Valor em destaque\u003c/label>\n            \u003clabel class=\"check\" data-types=\"line\">\u003cinput type=\"checkbox\" id=\"c-area\" data-k=\"area\">Preencher \u00e1rea\u003c/label>\n            \u003clabel class=\"check\" data-types=\"gauge\">\u003cinput type=\"checkbox\" id=\"c-ul\" data-k=\"underline\">Sublinhar n\u00famero\u003c/label>\n          \u003c/div>\n        \u003c/div>\n      \u003c/details>\n\n      \u003cdetails class=\"sec minor\">\n        \u003csummary>\u003cspan class=\"sum-t\">\u003cb>Letras e n\u00fameros\u003c/b>\u003c/span>\u003c/summary>\n        \u003cdiv class=\"sec-body\">\n          \u003cdiv class=\"field\">\u003cspan>Fonte de destaque (t\u00edtulos e n\u00fameros grandes)\u003c/span>\n            \u003cdiv class=\"seg\">\n              \u003clabel>\u003cinput type=\"radio\" name=\"serif\" value=\"Newsreader\" data-k=\"serif\">\u003cspan class=\"f-hl\">Newsreader\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"serif\" value=\"Tenor Sans\" data-k=\"serif\">\u003cspan class=\"f-tenor\">Tenor Sans\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/div>\n          \u003cp class=\"hint\">Os demais textos usam DM Sans.\u003c/p>\n          \u003clabel class=\"field\" id=\"weightField\">\u003cspan>Peso da Newsreader \u003coutput data-o=\"serifWeight\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-sw\" data-k=\"serifWeight\" min=\"200\" max=\"700\" step=\"50\">\u003c/label>\n          \u003clabel class=\"field\">\u003cspan>Tamanho dos textos \u003coutput data-o=\"typeScale\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-ts\" data-k=\"typeScale\" min=\"0.6\" max=\"1.6\" step=\"0.05\">\u003c/label>\n          \u003cdiv class=\"row3\">\n            \u003clabel class=\"field\">\u003cspan>Antes do n\u00famero\u003c/span>\u003cinput type=\"text\" id=\"f-pre\" data-k=\"prefix\" placeholder=\"R$ \">\u003c/label>\n            \u003clabel class=\"field\">\u003cspan>Depois do n\u00famero\u003c/span>\u003cinput type=\"text\" id=\"f-suf\" data-k=\"suffix\" placeholder=\"%\">\u003c/label>\n            \u003clabel class=\"field\">\u003cspan>Casas decimais\u003c/span>\u003cinput type=\"number\" id=\"f-dec\" data-k=\"decimals\" min=\"0\" max=\"4\" step=\"1\">\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"field\">\u003cspan>Formato dos n\u00fameros\u003c/span>\n            \u003cdiv class=\"seg\">\n              \u003clabel>\u003cinput type=\"radio\" name=\"locale\" value=\"pt-BR\" data-k=\"locale\">\u003cspan>Brasil \u00b7 1.234,5\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"radio\" name=\"locale\" value=\"en-US\" data-k=\"locale\">\u003cspan>EUA \u00b7 1,234.5\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/details>\n\n      \u003cdetails class=\"sec minor\">\n        \u003csummary>\u003cspan class=\"sum-t\">\u003cb>Tamanho e margens\u003c/b>\u003c/span>\u003c/summary>\n        \u003cdiv class=\"sec-body\">\n          \u003cdiv class=\"row2\">\n            \u003clabel class=\"field\">\u003cspan>Largura (px)\u003c/span>\u003cinput type=\"number\" id=\"f-w\" data-k=\"w\" min=\"200\" max=\"6000\" step=\"10\">\u003c/label>\n            \u003clabel class=\"field\">\u003cspan>Altura (px)\u003c/span>\u003cinput type=\"number\" id=\"f-h\" data-k=\"h\" min=\"200\" max=\"6000\" step=\"10\">\u003c/label>\n          \u003c/div>\n          \u003clabel class=\"field\">\u003cspan>Margem \u003coutput data-o=\"padding\">\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"f-pad\" data-k=\"padding\" min=\"0\" max=\"18\" step=\"0.5\">\u003c/label>\n          \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"c-frame\" data-k=\"frame\">Contorno de cart\u00e3o\u003c/label>\n        \u003c/div>\n      \u003c/details>\n    \u003c/aside>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"picker\" hidden>\n  \u003cdiv class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"pickTitle\">\n    \u003ch2 id=\"pickTitle\">Qual gr\u00e1fico voc\u00ea quer fazer?\u003c/h2>\n    \u003cp>Todos come\u00e7am com dados de exemplo. Depois \u00e9 s\u00f3 trocar pelos seus.\u003c/p>\n    \u003cdiv class=\"picks\" id=\"picks\">\u003c/div>\n    \u003cdiv class=\"dlg-foot\">\u003cbutton class=\"btn\" id=\"pickClose\" type=\"button\">Cancelar\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"fallback\" hidden>\n  \u003cdiv class=\"dialog fallback\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"fbTitle\">\n    \u003ch2 id=\"fbTitle\">Sua imagem est\u00e1 pronta\u003c/h2>\n    \u003cp>Clique com o bot\u00e3o direito na imagem (ou segure o dedo, no celular) e escolha \u201cSalvar imagem\u201d.\u003c/p>\n    \u003cimg id=\"fbImg\" alt=\"Gr\u00e1fico exportado\">\n    \u003cdiv class=\"dlg-foot\">\u003cbutton class=\"btn\" id=\"fbClose\" type=\"button\">Fechar\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\" hidden>\u003c/div>\n\n\u003cscript>\n(() => {\n'use strict';\n\n/* ---------- palettes drawn from the reference work ---------- */\nconst PALETTES = {\n  cream:  { name:'Cobalto',   bg:'#FDF8F0', ink:'#121C4A', colors:['#4174CC','#6792D6','#E8C36D','#B1C7EA','#121C4A'] },\n  navy:   { name:'Noite', bg:'#111C4B', ink:'#FBF4E6', colors:['#E8C36D','#4174CC','#8AABDF','#F2DAA3','#FBF4E6'] },\n  sky:    { name:'C\u00e9u',      bg:'#D4E4F4', ink:'#121C4A', colors:['#4174CC','#8AABDF','#E8C36D','#121C4A'] },\n  gold:   { name:'Mel',    bg:'#FDF8F0', ink:'#121C4A', colors:['#E8C36D','#F2DAA3','#FAF1E1','#EECD8A'] },\n  forest: { name:'Floresta',   bg:'#FDF8F0', ink:'#3D544D', colors:['#3D544D','#617570','#8A9893','#B2BCB8'] },\n  taupe:  { name:'Areia',    bg:'#FFFFFF', ink:'#121C4A', colors:['#BAA591','#C6B3A4','#D6C8BB','#E6DCD2'] },\n};\n\nconst SERIES_LIMIT = { leaf:1, grouped:8, capsules:3, pills:3, donut:1, pie:1, line:8, gauge:0, kpi:0 };\nconst LEGEND_TYPES = ['leaf','grouped','capsules','pills','donut','pie','line'];\nconst TEXT_COL_TYPES = ['leaf','capsules','pie'];\n// whole-number percentages that always add up to 100 (largest remainder)\nfunction pcts(vals, total){\n  if (!total) return vals.map(()=>0);\n  const raw = vals.map(v => v/total*100), fl = raw.map(Math.floor);\n  let rem = 100 - fl.reduce((a,b)=>a+b,0);\n  raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i]) => { if (rem > 0 && vals[i] > 0){ fl[i]++; rem--; } });\n  return fl;\n}\n\nconst uid = () => Math.random().toString(36).slice(2,10);\nconst rows = arr => arr.map(a => ({ label:String(a[0]), v:a.slice(1).map(String), t:'' }));\n\nfunction base(){\n  return {\n    id:uid(), name:'Gr\u00e1fico sem nome', type:'leaf', title:'', subtitle:'', note:'',\n    series:['Valores'], rows:[], palette:'cream', colors:[], bgMode:'palette', bgColor:'#FFFFFF', ink:'',\n    serif:'Newsreader', serifWeight:300, sans:'DM Sans',\n    preset:'1600x900', w:1600, h:900, typeScale:1, padding:7, frame:false,\n    corner:'leaf', radius:0.22, gap:0, groupGap:0.2, capGap:0.14,\n    valueStyle:'header', valueFont:'serif', rules:true, colorBy:'category',\n    showValues:true, showLegend:false, showAxis:true, grid:false, showCategory:false,\n    pillStyle:'outlined', pillSize:9, thick:0.42, gthick:0.055, rotation:0, roundCaps:true, sortDesc:false,\n    centerValue:'', centerLabel:'', gauge:{ value:'50', max:'100', text:'', label:'' }, underline:true,\n    kpi:{ value:'', caption:'', tag:'' },\n    prefix:'', suffix:'', decimals:0, locale:'pt-BR', showSummary:true, deltaLabel:'', area:false,\n    exportScale:2,\n  };\n}\n\nfunction lineSample(){\n  let v = 17800, out = [], s = 7;\n  const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;\n  for (let i=0;i\u003c60;i++){\n    const h = 9 + Math.floor(i/60*8), m = Math.floor((i%7.5)*8);\n    if (i===26) v += 520; if (i===30) v += 340; if (i===34) v += 260;\n    v += (rnd()-0.45) * 70;\n    out.push([`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`, v.toFixed(2)]);\n  }\n  return out;\n}\n\nconst TEMPLATES = [\n  { id:'leaf-editorial', label:'Colunas com n\u00fameros grandes', desc:'N\u00fameros grandes no topo de cada coluna. Bom para comparar meses.',\n    make:()=>({ type:'leaf', name:'Fev \u2013 Abr', palette:'cream', valueStyle:'header', valueFont:'serif', suffix:'%', preset:'1200x900', w:1200, h:900,\n      rows:rows([['fev.',34],['mar.',26],['abr.',41]]) }) },\n  { id:'leaf-labeled', label:'Colunas com descri\u00e7\u00e3o', desc:'N\u00famero dentro da barra e uma explica\u00e7\u00e3o embaixo.',\n    make:()=>({ type:'leaf', name:'Calculadora', palette:'gold', title:'Calculadora\\nde pagamentos', valueStyle:'inside', valueFont:'sans', rules:false,\n      colors:['#EECD8A','#E8C36D','#EECD8A','#F2DAA3'],\n      rows:[{label:'Meses a pagar com base no m\u00ednimo.',v:['60'],t:''},{label:'Meses a pagar com base em pagamento proposto',v:['90'],t:''},{label:'Taxa de juros com base no m\u00ednimo',v:['60'],t:'R$ 2.364'},{label:'Total de juros com base em pagamento proposto',v:['44'],t:'R$ 436'}] }) },\n  { id:'grouped', label:'Colunas lado a lado', desc:'Compara dois ou mais valores em cada grupo, como previsto e realizado.',\n    make:()=>({ type:'grouped', name:'Fluxo do m\u00eas', palette:'sky', prefix:'$', series:['Previsto','Realizado'], showAxis:true, showValues:false,\n      rows:rows([['Flow',2960,2430],['Receitas do m\u00eas',4950,4480],['Gastos do m\u00eas',3880,3880]]) }) },\n  { id:'capsules', label:'C\u00e1psulas', desc:'At\u00e9 tr\u00eas valores, um dentro do outro, em cada coluna.',\n    make:()=>({ type:'capsules', name:'Camadas', palette:'forest', bgMode:'white', series:['Total','Ativos','Recorrentes'],\n      rows:rows([['T1',21,16.4,12.6],['T2',54,46,37],['T3',18,15.5,11],['T4',35,21.7,14.4]]) }) },\n  { id:'pills-inset', label:'Barras horizontais', desc:'At\u00e9 tr\u00eas valores por linha, um dentro do outro.',\n    make:()=>({ type:'pills', name:'Faixas', palette:'gold', bgMode:'white', pillStyle:'outlined', series:['Meta','Projetado','Atual'],\n      rows:rows([['Norte',25,20,14],['Sudeste',55,38,25],['Sul',45,25,18]]) }) },\n  { id:'pills-flush', label:'Barras horizontais lisas', desc:'At\u00e9 tr\u00eas valores por linha, todos da mesma altura.',\n    make:()=>({ type:'pills', name:'Faixas taupe', palette:'taupe', pillStyle:'flush', series:['Meta','Projetado','Atual'],\n      rows:rows([['Norte',25,20,14],['Sudeste',55,38,25],['Sul',45,25,18]]) }) },\n  { id:'donut', label:'Rosca', desc:'Mostra partes de um todo, com um n\u00famero no centro.',\n    make:()=>({ type:'donut', name:'Clientes', palette:'cream', preset:'1080x1080', w:1080, h:1080, colors:['#4174CC','#B1C7EA'], roundCaps:true, sortDesc:false,\n      centerValue:'2.345', centerLabel:'Clientes ativos', rows:rows([['Ativos',78],['Inativos',22]]) }) },\n  { id:'pie', label:'Pizza', desc:'Mostra quanto cada parte representa do total, em %.',\n    make:()=>({ type:'pie', name:'Por trimestre', palette:'forest', preset:'1080x1080', w:1080, h:1080, decimals:1,\n      rows:rows([['1\u00ba tri',8.2],['2\u00ba tri',3.2],['3\u00ba tri',1.4],['4\u00ba tri',1.2]]) }) },\n  { id:'gauge', label:'Medidor', desc:'Um \u00fanico percentual, como uma meta atingida.',\n    make:()=>({ type:'gauge', name:'Progresso', palette:'navy', preset:'1080x1080', w:1080, h:1080, suffix:'%', gauge:{value:'50',max:'100',text:'',label:''} }) },\n  { id:'line', label:'Linha', desc:'Mostra como um valor mudou ao longo do tempo.',\n    make:()=>({ type:'line', name:'Investindo', palette:'navy', title:'Investindo', prefix:'$', decimals:2, frame:true, deltaLabel:'hoje',\n      grid:true, series:['Carteira'], rows:rows(lineSample()) }) },\n  { id:'kpi', label:'N\u00famero em destaque', desc:'Um \u00fanico n\u00famero grande, com um texto de apoio.',\n    make:()=>({ type:'kpi', name:'C\u00e2mbio', palette:'navy', frame:true, preset:'1600x900', w:1600, h:900,\n      kpi:{ value:'US$ 3.632,52', caption:'US$ 1 = R$ 5,51', tag:'Quinta-feira 15/08' } }) },\n];\n\nfunction fromTem function lum(h){ const [r,g,b] = hexRgb(h).map(v=>{ v/=255; return v\u003c=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); }); return .2126*r+.7152*g+.0722*b; }\n\nfunction pal(c){\n  const P = PALETTES[c.palette] || PALETTES.cream;\n  return { bg:P.bg, ink:c.ink || P.ink, colors:P.colors };\n}\nconst col = (c,P,i) => c.colors[i] || P.colors[i % P.colors.length];\n\n/* ---------- canvas helpers ---------- */\nconst serifF = (c,s,w) => `${w ?? c.serifWeight} ${s}px \"${c.serif}\", Georgia, serif`;\nconst sansF  = (c,s,w) => `${w ?? 400} ${s}px \"${c.sans}\", \"Helvetica Neue\", Arial, sans-serif`;\nconst hlF = (c,s) => c.valueFont==='sans' ? sansF(c,s,500) : serifF(c,s);\n\nfunction wrap(ctx, text, maxW){\n  const out = [];\n  String(text ?? '').split('\\n').forEach(par => {\n    const words = par.split(/\\s+/).filter(Boolean); let line = '';\n    if (!words.length){ out.push(''); return; }\n    words.forEach(w => { const t = line ? line+' '+w : w; if (ctx.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; });\n    out.push(line);\n  });\n  return out;\n}\nfunction fit(ctx, mk, text, size, maxW, min){\n  ctx.font = mk(size); const w = ctx.measureText(text).width;\n  if (w > maxW && w > 0) size = Math.max(min ?? 4, size * maxW / w);\n  ctx.font = mk(size); return size;\n}\nfunction rr(ctx,x,y,w,h,r){ r = Math.max(0, Math.min(r, w/2, h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }\nfunction pill(ctx,x,y,w,h){ rr(ctx,x,y,w,h,Math.min(w,h)/2); }\n\n// the signature shape: a column whose top-left corner is a soft elliptical leaf\nfunction barPath(ctx,x,y,w,h,style,ratio){\n  ctx.beginPath();\n  if (h \u003c= 0 || w \u003c= 0) return;\n  const K = 0.5523;\n  let rx, ry;\n  if (style === 'pill'){ rx = w/2; ry = Math.min(w/2, h); }\n  else { rx = Math.min(w*ratio*1.1, w*(style==='top'?0.5:1)); ry = Math.min(rx*0.88, h); }\n  con // as a file object made in this page: one made inside a tool's frame is rejected.
window.__atelieSave = async (filename, buf, type) => {
  const c = window.claude; const dl = c && c.use ? await c.use('downloads') : null;
  if (!dl) { const e = new Error('Saving is not available in this view.'); e.code = 'unavailable'; throw e; }
  return dl.save({ filename, data: new Blob([buf], { type: type || '' }) });
};
const TOOLS = [
  {id:'colchetes', name:'Colchetes', kind:'Palavras animadas', color:'--c-brackets'},
  {id:'graficos', name:'Gráficos', kind:'Para slides', color:'--c-charts'},
];
const tabs = document.getElementById('tabs'), frames = document.getElementById('frames');
const loaded = {};
TOOLS.forEach((t, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.id = 'tab-' + t.id; b.setAttribute('role', 'tab');
  b.style.setProperty('--tc', `var(${t.color})`);
  b.innerHTML = `<span class="dot" aria-hidden="true"></span>${t.name}<small>${t.kind}</small>`;
  b.title = `${t.name} (Alt+${i + 1})`;
  b.addEventListener('click', () => show(t.id));
  tabs.appendChild(b);
});
let current = null;
function show(id){
  if (!APPS[id]) id = TOOLS[0].id;
  if (!loaded[id]) {
    const f = document.createElement('iframe');
    f.title = TOOLS.find(t => t.id === id).name;
    f.setAttribute('allow', 'fullscreen; clipboard-write');
    f.srcdoc = APPS[id];
    f.addEventListener('load', () => { try { f.contentWindow.addEventListener('keydown', hotkey); } catch (e) {} });
    frames.appendChild(f); loaded[id] = f;
  }
  for (const k in loaded) loaded[k].hidden = k !== id;
  TOOLS.forEach(t => document.getElementById('tab-' + t.id).setAttribute('aria-selected', String(t.id === id)));
  current = id;
  try { localStorage.setItem('estudio-tab', id); } catch (e) {}
  if (location.hash.slice(1) !== id) try { history.replaceState(null, '', '#' + id); } catch (e) {}
  try { loaded[id].contentWindow.focus(); } catch (e) {}
}
function hotkey(e){
  if (!e.altKey || e.ctrlKey || e.metaKey) return;
  const n = parseInt(e.code.replace('Digit', ''), 10);
  if (n >= 1 && n <= TOOLS.length) { e.preventDefault(); show(TOOLS[n - 1].id); }
}
document.addEventListener('keydown', hotkey);
tabs.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = TOOLS.findIndex(t => t.id === current), j = (i + (e.key === 'ArrowRight' ? 1 : -1) + TOOLS.length) % TOOLS.length;
  show(TOOLS[j].id); document.getElementById('tab-' + TOOLS[j].id).focus();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (APPS[h] && h !== current) show(h); });
let start = location.hash.slice(1);
if (!APPS[start]) { try { start = localStorage.getItem('estudio-tab') || ''; } catch (e) { start = ''; } }
show(start);
})();
</script>
